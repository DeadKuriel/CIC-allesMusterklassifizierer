[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allesmusterklassifizierer"
version = "0.1.0"
description = "Framework modular para validación y clasificación en datasets CSV (holdout, LOO, kfold, Euclidean centroid, KNN)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8"
]

[project.scripts]
amk = "allesmusterklassifizierer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
