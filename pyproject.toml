[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allesmusterklassifizierer"
version = "0.2.0"
description = "Framework reproducible y metodológicamente seguro para clasificación tabular."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pydantic>=2.7,<3",
  "scikit-learn>=1.4",
  "imbalanced-learn>=0.12",
  "joblib>=1.3",
  "matplotlib>=3.8"
]

[project.optional-dependencies]
formats = ["pyarrow>=15", "openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pandas-stubs>=2.2", "pre-commit>=3.7", "pyarrow>=15", "openpyxl>=3.1"]

[project.scripts]
amk = "allesmusterklassifizierer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
files = [
  "src/allesmusterklassifizierer/v1config.py",
  "src/allesmusterklassifizierer/dataset.py",
  "src/allesmusterklassifizierer/audit.py",
  "src/allesmusterklassifizierer/preprocessing.py",
  "src/allesmusterklassifizierer/splitting.py",
  "src/allesmusterklassifizierer/models.py",
  "src/allesmusterklassifizierer/evaluation.py",
  "src/allesmusterklassifizierer/metrics/confusion_demo.py",
  "src/allesmusterklassifizierer/artifacts.py",
  "src/allesmusterklassifizierer/experiment.py",
]
