name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e '.[dev,formats]'
      - run: ruff check .
      - run: mypy src/allesmusterklassifizierer
      - run: pytest --cov=allesmusterklassifizierer --cov-report=term-missing
